[package]
name = "bdp-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bdp-mcp"
path = "src/main.rs"

[dependencies]
# MCP
rmcp = { version = "1.2.0", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.42", features = ["full", "test-util"] }
