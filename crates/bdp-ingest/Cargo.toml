[package]
name = "bdp-ingest"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "bdp_ingest"
path = "src/lib.rs"

[[bin]]
name = "bdp-ingest"
path = "src/main.rs"

[dependencies]
# ============================================================================
# Workspace Dependencies
# ============================================================================
bdp-common = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }

# ============================================================================
# HTTP Client
# ============================================================================
reqwest = { workspace = true }

# ============================================================================
# Database (optional for direct ingestion to DB)
# ============================================================================
sqlx = { workspace = true, optional = true }

# ============================================================================
# CLI Framework
# ============================================================================
clap = { workspace = true }

# ============================================================================
# Utilities
# ============================================================================
chrono = { workspace = true }
uuid = { workspace = true }

# ============================================================================
# Additional Ingest Dependencies
# ============================================================================
# XML parsing
quick-xml = { workspace = true }

# HTML parsing and scraping
scraper = { workspace = true }
select = "0.6"

# Progress indicators
indicatif = "0.17"

# Async utilities
tokio-util = { version = "0.7", features = ["io", "codec"] }
tokio-stream = "0.1"

# File I/O
flate2 = "1.0"
tar = "0.4"

# Bytes buffer
bytes = "1"

# CSV parsing
csv = "1.3"
csv-async = "1.3"

# JSON streaming
serde-jsonlines = "0.5"

# Parquet/Arrow (Open Targets)
arrow = { version = "53", default-features = false, features = ["ipc"] }
parquet = { version = "53", default-features = false, features = ["async", "arrow"] }
arrow-array = "53"

# SQLite ETL (ChEMBL)
rusqlite = { version = "0.32", features = ["bundled"] }

# Async gzip streaming (PubMed)
async-compression = { version = "0.4", features = ["tokio", "gzip"] }

[dev-dependencies]
# Testing
tempfile = "3.10"
wiremock = "0.6"

# Test utilities from workspace
tokio = { workspace = true, features = ["test-util"] }

# E2E storage tests (testcontainers)
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["postgres"] }
sqlx = { workspace = true }

[features]
default = ["database"]
# Enable database support for direct ingestion
database = ["sqlx"]
