[package]
name = "bdp-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "bdp_server"
path = "src/lib.rs"

[[bin]]
name = "bdp-server"
path = "src/main.rs"

[[example]]
name = "ncbi_taxonomy_test_small"

[[example]]
name = "genbank_test_phage"

[[example]]
name = "go_test_sample"

[[example]]
name = "go_test_ftp"

[[example]]
name = "go_test_human"

[[example]]
name = "go_test_local_ontology"

[[example]]
name = "ncbi_taxonomy_full_catchup"

[[bench]]
name = "genbank_streaming_bench"
harness = false

[dependencies]
# ============================================================================
# Workspace Dependencies
# ============================================================================
bdp-common = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# ============================================================================
# Web Framework
# ============================================================================
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# ============================================================================
# Database
# ============================================================================
sqlx = { workspace = true }
ipnetwork = "0.20"

# ============================================================================
# Configuration
# ============================================================================
config = { workspace = true }
dotenvy = { workspace = true }

# ============================================================================
# Utilities
# ============================================================================
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }

# ============================================================================
# Vector Search
# ============================================================================
pgvector = { version = "0.4", features = ["sqlx"] }
async-openai = "0.27"
moka = { version = "0.12", features = ["future"] }

# ============================================================================
# CQRS / Mediator
# ============================================================================
mediator = { workspace = true }

# ============================================================================
# Job Queue
# ============================================================================
apalis = { workspace = true }
# Re-enabled with recursion_limit fix in lib.rs
apalis-postgres = { workspace = true }
apalis-cron = { workspace = true }

# ============================================================================
# FTP Client
# ============================================================================
suppaftp = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }

# ============================================================================
# AWS SDK / S3 Storage
# ============================================================================
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-credential-types = { workspace = true }

# ============================================================================
# Additional Server Dependencies
# ============================================================================
# HTTP types
http = "1.1"
http-body = "1.0"
http-body-util = "0.1"

# Async utilities
tokio-util = { version = "0.7", features = ["io"] }

# Environment
figment = { version = "0.10", features = ["toml", "env"] }

# Rate limiting
governor = "0.6"
tower_governor = "0.4"
hostname = "0.4.2"
quick-xml = { workspace = true }
md5 = { version = "0.7", features = ["std"] }
async-trait = "0.1.89"
digest = "0.10.7"
regex = { workspace = true }
scraper = { workspace = true }

[dev-dependencies]
# Testing
tokio-test = "0.4"
tempfile = "3.10"
wiremock = "0.6"
insta = "1.34"

# E2E Testing
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["postgres", "minio"] }
serial_test = "3.2"
ctor = "0.2"
reqwest = { workspace = true }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# Test utilities from workspace
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
# Enable when you want to fail compilation if SQL queries are not prepared offline
sqlx-offline = []
