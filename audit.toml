# Cargo audit configuration for BDP
# See https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example

[advisories]
# Ignore advisories for specific IDs
ignore = [
    # RUSTSEC-2026-0001: rkyv - Potential UB in Arc/Rc from_value on OOM
    # This is a transitive dependency (not directly used) and affects only OOM scenarios
    # which are already fatal. Patched version 0.7.46 is already in use.
    "RUSTSEC-2026-0001",

    # RUSTSEC-2023-0071: rsa - Marvin Attack timing sidechannel
    # Transitive dependency via sqlx-mysql (we only use PostgreSQL)
    # No fixed version available, and we don't use MySQL features
    # See: https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",
]

# Report informational warnings for unmaintained and unsound crates
informational_warnings = ["unmaintained", "unsound"]

# CVSS severity threshold - fail on medium or higher vulnerabilities
severity_threshold = "medium"

[database]
# URL to the advisory database's git repo
url = "https://github.com/rustsec/advisory-db.git"

# Fetch the advisory database from the URL
fetch = true

[output]
# Format: terminal (human readable) or json
format = "terminal"

# Only print information on error
quiet = false

# Show inverse dependency trees along with advisories
show_tree = true

[target]
# Target CPU architectures to check
arch = ["x86_64"]

# Target operating systems to check
os = ["linux", "windows", "macos"]

[yanked]
# Warn for yanked crates in Cargo.lock
enabled = true

# Auto-update the crates.io index
update_index = true
