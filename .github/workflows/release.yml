name: Release

run-name: "Release ${{ inputs.version_bump }} → ${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      environment:
        description: 'Environment to deploy'
        type: environment
        required: true
        default: production
      dry_run:
        description: 'Dry run (no actual release)'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/bdp

jobs:
  # Calculate new version
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.version.outputs.current }}
      new: ${{ steps.version.outputs.new }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get current version
        id: version
        run: |
          CURRENT=$(grep -m1 'version = "' Cargo.toml | sed 's/.*version = "\([^"]*\)".*/\1/')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.version_bump }}" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "tag=v$NEW" >> $GITHUB_OUTPUT

          echo "Version: $CURRENT → $NEW (v$NEW)"

  # Bump versions across all crates
  bump-versions:
    name: Bump Versions
    needs: [version]
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Cargo.toml versions
        run: |
          NEW_VERSION="${{ needs.version.outputs.new }}"

          # Update workspace version
          sed -i "s/^version = \"[^\"]*\"/version = \"$NEW_VERSION\"/" Cargo.toml

          # Update each crate that inherits workspace version
          for crate in crates/*/Cargo.toml xtask/Cargo.toml; do
            if grep -q 'version.workspace = true' "$crate"; then
              echo "Crate $crate uses workspace version"
            else
              sed -i "s/^version = \"[^\"]*\"/version = \"$NEW_VERSION\"/" "$crate"
            fi
          done

      - name: Bump package.json version
        run: |
          NEW_VERSION="${{ needs.version.outputs.new }}"
          if [ -f "web/package.json" ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" web/package.json
          fi

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Update Cargo.lock
        run: cargo update --workspace

      - name: Commit version bump
        run: |
          git add -A
          git commit -m "chore(release): bump version to ${{ needs.version.outputs.new }}"
          git push

      - name: Create and push tag
        run: |
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

  # Build CLI binaries with cargo-dist
  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: [version, bump-versions]
    if: always() && (needs.bump-versions.result == 'success' || inputs.dry_run)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build CLI
        run: cargo build --release --package bdp-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bdp dist/
          cd dist && tar -czvf bdp-cli-${{ needs.version.outputs.new }}-${{ matrix.target }}.tar.gz bdp

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/bdp.exe dist/
          Compress-Archive -Path dist/bdp.exe -DestinationPath dist/bdp-cli-${{ needs.version.outputs.new }}-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/bdp-cli-*

  # Build Docker images
  build-docker:
    name: Build Docker (${{ matrix.name }})
    needs: [version, bump-versions]
    if: always() && (needs.bump-versions.result == 'success' || inputs.dry_run)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: docker/Dockerfile.server
          - name: web
            dockerfile: docker/Dockerfile.web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.new }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.new }}
            type=raw,value=latest

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create draft release (automatic, no approval needed)
  create-draft-release:
    name: Create Draft Release
    needs: [version, build-cli, build-docker]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "Release ${{ needs.version.outputs.tag }}" \
            --draft \
            --generate-notes \
            artifacts/*

      - name: Summary
        run: |
          echo "## Draft Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.version.outputs.new }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ needs.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Draft (testing installers, then awaiting deploy approval)" >> $GITHUB_STEP_SUMMARY

  # Test installers
  test-installers:
    name: Test Installer (${{ matrix.os }})
    needs: [version, create-draft-release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true

      - name: Install (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ARCH="x86_64-apple-darwin"
          else
            ARCH="x86_64-unknown-linux-gnu"
          fi
          tar -xzf artifacts/bdp-cli-*-$ARCH.tar.gz
          chmod +x bdp
          sudo mv bdp /usr/local/bin/

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path artifacts/bdp-cli-*-x86_64-pc-windows-msvc.zip -DestinationPath .
          Move-Item bdp.exe $env:USERPROFILE/.cargo/bin/

      - name: Verify installation
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
          fi
          bdp --version
          VERSION_OUTPUT=$(bdp --version)
          if ! echo "$VERSION_OUTPUT" | grep -q "${{ needs.version.outputs.new }}"; then
            echo "Version mismatch!"
            exit 1
          fi
          bdp --help
          echo "Installation verified"

  # Deploy to server (single approval gate before deploy + publish)
  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: [version, test-installers]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Setup server (idempotent)
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.SERVER_IP }} << 'SETUP'
          set -e

          # Force Docker to use IPv4 (ghcr.io has IPv6 connectivity issues on some hosts)
          if ! grep -q '"ipv6": false' /etc/docker/daemon.json 2>/dev/null; then
            echo "Configuring Docker to use IPv4..."
            echo '{"ipv6": false}' | sudo tee /etc/docker/daemon.json > /dev/null
            sudo systemctl restart docker
          fi

          sudo mkdir -p /opt/bdp/backups /opt/bdp/data
          sudo chown -R ubuntu:ubuntu /opt/bdp
          SETUP

      - name: Deploy
        env:
          VERSION: ${{ needs.version.outputs.new }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.STORAGE_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.STORAGE_S3_SECRET_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
          S3_ENDPOINT: ${{ vars.STORAGE_S3_ENDPOINT }}
          S3_REGION: ${{ vars.STORAGE_S3_REGION }}
          S3_BUCKET: ${{ vars.STORAGE_S3_BUCKET }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          RUST_LOG: ${{ vars.RUST_LOG || 'info,bdp_server=info,sqlx=warn' }}
        run: |
          scp -i ~/.ssh/deploy_key \
            infrastructure/deploy/docker-compose.prod.yml \
            ubuntu@${{ secrets.SERVER_IP }}:/opt/bdp/docker-compose.yml

          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.SERVER_IP }} << DEPLOY
          set -e
          cd /opt/bdp

          cat > .env << 'EOF'
          DOMAIN=${DOMAIN}
          ACME_EMAIL=${ACME_EMAIL}
          PUBLIC_URL=https://${DOMAIN}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          STORAGE_S3_ENDPOINT=${S3_ENDPOINT}
          STORAGE_S3_REGION=${S3_REGION}
          STORAGE_S3_BUCKET=${S3_BUCKET}
          STORAGE_S3_ACCESS_KEY=${S3_ACCESS_KEY}
          STORAGE_S3_SECRET_KEY=${S3_SECRET_KEY}
          RUST_LOG=${RUST_LOG}
          EOF

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Pull specific version
          docker pull ghcr.io/${{ github.repository_owner }}/bdp-server:${{ needs.version.outputs.new }}
          docker pull ghcr.io/${{ github.repository_owner }}/bdp-web:${{ needs.version.outputs.new }}

          # Tag as latest for docker-compose
          docker tag ghcr.io/${{ github.repository_owner }}/bdp-server:${{ needs.version.outputs.new }} ghcr.io/${{ github.repository_owner }}/bdp-server:latest
          docker tag ghcr.io/${{ github.repository_owner }}/bdp-web:${{ needs.version.outputs.new }} ghcr.io/${{ github.repository_owner }}/bdp-web:latest

          docker compose up -d --remove-orphans
          docker compose ps
          DEPLOY

      - name: Health check
        run: |
          sleep 30
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.SERVER_IP }} << 'CHECK'
          for i in {1..5}; do
            if curl -sf http://localhost/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          exit 1
          CHECK

  # Publish release (after successful deploy)
  publish-release:
    name: Publish Release
    needs: [version, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.version.outputs.tag }}" \
            --repo ${{ github.repository }} \
            --draft=false

      - name: Summary
        run: |
          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.version.outputs.new }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ needs.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Images**:" >> $GITHUB_STEP_SUMMARY
          echo "  - \`ghcr.io/${{ github.repository_owner }}/bdp-server:${{ needs.version.outputs.new }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - \`ghcr.io/${{ github.repository_owner }}/bdp-web:${{ needs.version.outputs.new }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
