name: Deploy

run-name: "Deploy ${{ inputs.version || 'latest' }} to ${{ inputs.environment || 'production' }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        type: environment
        required: true
        default: production
      version:
        description: 'Version to deploy (e.g., 0.1.3). Leave empty for latest.'
        type: string
        required: false
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        default: production
      version:
        type: string
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Setup server (idempotent)
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.SERVER_IP }} << 'SETUP'
          set -e

          if ! command -v docker &> /dev/null; then
            echo "Installing Docker..."
            curl -fsSL https://get.docker.com | sh
            sudo usermod -aG docker ubuntu
            echo "Docker installed. You may need to re-run this workflow."
          fi

          if ! docker ps &> /dev/null; then
            echo "Docker permission issue - trying with sudo for this run"
            sudo docker ps > /dev/null
          fi

          # Force Docker to use IPv4 (ghcr.io has IPv6 connectivity issues on some hosts)
          if ! grep -q '"ipv6": false' /etc/docker/daemon.json 2>/dev/null; then
            echo "Configuring Docker to use IPv4..."
            echo '{"ipv6": false}' | sudo tee /etc/docker/daemon.json > /dev/null
            sudo systemctl restart docker
          fi

          # Ensure swap exists (prevents OOM kills on 8GB servers)
          if [ ! -f /swapfile ]; then
            echo "Creating 4GB swap file..."
            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          elif ! swapon --show | grep -q /swapfile; then
            sudo swapon /swapfile
          fi

          sudo mkdir -p /opt/bdp/backups /opt/bdp/data
          sudo chown -R ubuntu:ubuntu /opt/bdp

          if ! crontab -l 2>/dev/null | grep -q pg_dump; then
            echo "Setting up PostgreSQL backup cron..."
            (crontab -l 2>/dev/null || true; echo "0 3 * * * docker exec bdp-postgres pg_dump -U bdp bdp | gzip > /opt/bdp/backups/bdp-\$(date +\%Y\%m\%d-\%H\%M\%S).sql.gz") | crontab -
            (crontab -l 2>/dev/null; echo "0 4 * * * find /opt/bdp/backups -name '*.sql.gz' -mtime +7 -delete") | crontab -
          fi

          echo "Server setup complete"
          SETUP

      - name: Deploy docker-compose
        run: |
          scp -i ~/.ssh/deploy_key \
            infrastructure/deploy/docker-compose.prod.yml \
            ubuntu@${{ secrets.SERVER_IP }}:/opt/bdp/docker-compose.yml

      - name: Fix migration checksums
        run: |
          # SQLx refuses to run if a previously-applied migration file has been modified.
          # Compute the current SHA-384 checksum and update _sqlx_migrations on the server.
          CHECKSUM=$(sha384sum migrations/20260204000003_widen_varchar_columns.sql | awk '{print $1}')
          echo "Updating checksum for migration 20260204000003 to ${CHECKSUM}"
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.SERVER_IP }} << FIXUP
          set -e
          cd /opt/bdp
          docker compose up -d postgres
          sleep 3
          docker exec bdp-postgres psql -U bdp -c \
            "UPDATE _sqlx_migrations SET checksum = decode('${CHECKSUM}', 'hex') WHERE version = 20260204000003;"
          FIXUP

      - name: Deploy and start services
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.STORAGE_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.STORAGE_S3_SECRET_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
          S3_ENDPOINT: ${{ vars.STORAGE_S3_ENDPOINT }}
          S3_REGION: ${{ vars.STORAGE_S3_REGION }}
          S3_BUCKET: ${{ vars.STORAGE_S3_BUCKET }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          RUST_LOG: ${{ vars.RUST_LOG || 'info,bdp_server=info,sqlx=warn' }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.SERVER_IP }} << DEPLOY
          set -e
          cd /opt/bdp

          cat > .env << 'EOF'
          DOMAIN=${DOMAIN}
          ACME_EMAIL=${ACME_EMAIL}
          PUBLIC_URL=https://${DOMAIN}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          STORAGE_S3_ENDPOINT=${S3_ENDPOINT}
          STORAGE_S3_REGION=${S3_REGION}
          STORAGE_S3_BUCKET=${S3_BUCKET}
          STORAGE_S3_ACCESS_KEY=${S3_ACCESS_KEY}
          STORAGE_S3_SECRET_KEY=${S3_SECRET_KEY}
          RUST_LOG=${RUST_LOG}
          EOF

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Pull all images (ensures traefik, postgres updates too)
          docker compose pull

          # If specific version provided, pull and tag as latest
          VERSION="${{ inputs.version }}"
          if [ -n "\$VERSION" ]; then
            echo "Deploying version \$VERSION"
            docker pull ghcr.io/${{ github.repository_owner }}/bdp-server:\$VERSION
            docker pull ghcr.io/${{ github.repository_owner }}/bdp-web:\$VERSION
            docker tag ghcr.io/${{ github.repository_owner }}/bdp-server:\$VERSION ghcr.io/${{ github.repository_owner }}/bdp-server:latest
            docker tag ghcr.io/${{ github.repository_owner }}/bdp-web:\$VERSION ghcr.io/${{ github.repository_owner }}/bdp-web:latest
          fi

          # Start postgres first to sync password
          docker compose up -d postgres
          sleep 5

          # Sync postgres password (handles password changes)
          if docker exec bdp-postgres pg_isready -U bdp > /dev/null 2>&1; then
            echo "Syncing postgres password..."
            docker exec bdp-postgres psql -U bdp -c "ALTER USER bdp PASSWORD '${POSTGRES_PASSWORD}';" || true
          fi

          docker compose up -d --force-recreate --remove-orphans || {
            echo "Docker compose failed, showing logs..."
            docker compose logs --tail=100
            exit 1
          }

          sleep 10
          if docker exec bdp-server curl -sf http://localhost:8000/health > /dev/null 2>&1; then
            echo "Server healthy"
          else
            echo "Warning: Server may still be starting..."
          fi

          docker compose ps
          DEPLOY

      - name: Health check
        timeout-minutes: 10
        run: |
          echo "Waiting for services to stabilize..."
          for i in $(seq 1 20); do
            sleep 15
            echo "Attempt $i/20..."
            if timeout 10 ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.SERVER_IP }} \
              'docker exec bdp-server curl -sf http://localhost:8000/health' 2>/dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Not ready yet, retrying..."
          done
          echo "Health check failed after 20 attempts"
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.SERVER_IP }} \
            'docker compose -f /opt/bdp/docker-compose.yml ps && docker compose -f /opt/bdp/docker-compose.yml logs --tail=50 bdp-server'
          exit 1

      - name: Summary
        if: success()
        run: |
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ inputs.version || 'latest' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Domain**: https://${{ vars.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
