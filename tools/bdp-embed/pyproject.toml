[project]
name = "bdp-embed"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "umap-learn>=0.5",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "joblib>=1.3",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.scripts]
bdp-embed = "bdp_embed.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
